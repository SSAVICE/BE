version: '3.8'

services:
  backend:
    container_name: ssavice-backend
    image: bongguscha/ssavice-backend:latest
    ports:
      - "8080:8080" # EC2 8080 - 컨테이너 8080
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-dev}
      DEV_DB_URL: ${DEV_DB_URL}
      DEV_DB_USERNAME: ${DEV_DB_USERNAME}
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD}
      S3_REGION: ${S3_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      NTS_SERVICE_KEY: ${NTS_SERVICE_KEY}
      SQS_THUMB_ALARM_QUEUE: ${SQS_THUMB_ALARM_QUEUE}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY}
      KAFKA_SERVER_URL: ${KAFKA_SERVER_URL}
      TZ: Asia/Seoul
    # 항상 최신
    pull_policy: always